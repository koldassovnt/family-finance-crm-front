server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Resolve the backend through Docker's DNS on each request rather than once
    # at startup, so nginx starts even when the backend container is down and
    # follows it across restarts that change its IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://family-finance-app:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/accounts/42, /bills...) all load index.html, which
    # must never be cached or a deploy won't reach open tabs.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
